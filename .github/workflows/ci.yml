name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Generate samples and batch-tag (offline)
        run: vision-tagger samples /tmp/samples && vision-tagger tag /tmp/samples -o tags.csv --html report.html
      - name: Smoke test
        run: vision-tagger tag examples/images -f json
